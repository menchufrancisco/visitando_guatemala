<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explora los sitios turísticos de Guatemala en un mapa interactivo y registra los que ya visitaste.">
  <meta property="og:title" content="Visitando Guatemala — Mapa turístico">
  <meta property="og:description" content="Explora y marca los sitios turísticos de Guatemala que ya visitaste.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇬🇹</text></svg>">
  <title>Visitando Guatemala — Departamento por departamento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="gt-app">
    <header class="gt-header">
      <div class="gt-header-left">
        <h1 class="gt-title">Guatemala</h1>
        <p class="gt-subtitle">Explora Guatemala · Marca los sitios que ya visitaste</p>
      </div>

      <div class="gt-stat">
        <div class="gt-stat-main">
          <span class="gt-stat-num" id="gt-stat-num">0/0</span>
          <span class="gt-stat-label" id="gt-stat-label">sitios</span>
        </div>
        <div class="gt-stat-sub" id="gt-stat-depts">0 de 22 departamentos</div>
        <div class="gt-bar-track">
          <div class="gt-bar-fill" id="gt-bar-fill"></div>
        </div>
      </div>
    </header>

    <main>
      <div class="gt-filters" aria-label="Filtros del mapa">
        <label class="gt-department-filter">
          <span>Departamento</span>
          <select id="gt-department-filter">
            <option value="all">Todos los departamentos</option>
          </select>
        </label>
        <label class="gt-pending-filter">
          <input id="gt-pending-filter" type="checkbox">
          <span>Solo pendientes</span>
        </label>
        <button class="gt-nearby-btn" id="gt-nearby-btn" type="button">📍 Cerca de mí</button>
      </div>

      <section class="gt-map-card" aria-label="Mapa de sitios turísticos de Guatemala">
        <div id="gt-leaflet-map" role="application" aria-label="Mapa interactivo con sitios turísticos de Guatemala"></div>
        <div class="gt-map-legend" aria-label="Leyenda de marcadores">
          <span><i class="gt-legend-pin pending"></i> Pendiente</span>
          <span><i class="gt-legend-pin visited"></i> Visitado</span>
        </div>
      </section>
      <section class="gt-nearby" id="gt-nearby" aria-live="polite" hidden>
        <h2 class="gt-nearby-title">Sitios pendientes más cercanos</h2>
        <ol class="gt-nearby-list" id="gt-nearby-list"></ol>
      </section>
    </main>

    <div class="gt-footer">
      <button class="gt-reset-btn" id="gt-reset">Reiniciar progreso</button>
    </div>
  </div>

  <div class="gt-toast" id="gt-toast"></div>
  <script src="script.js"></script>
</body>
</html>
