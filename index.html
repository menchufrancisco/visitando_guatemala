<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guatemala, departamento por departamento</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <div class="gt-app">
    <header class="gt-header">
      <div class="gt-header-left">
        <h1 class="gt-title">Guatemala</h1>
        <p class="gt-subtitle">Departamento por departamento · Marca los sitios que ya visitaste</p>
      </div>

      <div class="gt-stat">
        <div class="gt-stat-main">
          <span class="gt-stat-num" id="gt-stat-num">0/0</span>
          <span class="gt-stat-label" id="gt-stat-label">sitios</span>
        </div>
        <div class="gt-stat-sub" id="gt-stat-depts">0 de 22 departamentos</div>
        <div class="gt-bar-track">
          <div class="gt-bar-fill" id="gt-bar-fill"></div>
        </div>
      </div>
    </header>

    <div class="gt-layout" id="gt-main-view">
      <div class="gt-map-card">
        <svg id="gt-svg" role="img" aria-label="Mapa de los 22 departamentos de Guatemala"></svg>
        <div class="gt-legend">
          <span class="gt-legend-item"><span class="gt-swatch stone"></span> Sin visitar</span>
          <span class="gt-legend-item"><span class="gt-swatch gold"></span> Algunos</span>
          <span class="gt-legend-item"><span class="gt-swatch jade"></span> Completo</span>
        </div>
      </div>

      <div class="gt-panel" id="gt-panel"></div>
    </div>

    <section class="gt-detail-view" id="gt-detail-view" aria-label="Detalle del departamento" hidden>
      <button class="gt-back-btn" id="gt-back-btn" type="button">← Volver al mapa de Guatemala</button>
      <div class="gt-detail-heading">
        <div>
          <p class="gt-detail-kicker">Explora el departamento</p>
          <h2 class="gt-detail-title" id="gt-detail-title"></h2>
        </div>
        <p class="gt-detail-progress" id="gt-detail-progress"></p>
      </div>
      <div class="gt-detail-layout">
        <div class="gt-leaflet-card">
          <div id="gt-leaflet-map" aria-label="Mapa de sitios turísticos del departamento"></div>
        </div>
        <div class="gt-detail-sites" id="gt-detail-sites"></div>
      </div>
    </section>

    <div class="gt-footer">
      <button class="gt-reset-btn" id="gt-reset">Reiniciar progreso</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
